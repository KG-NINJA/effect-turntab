<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アナログレコード風ボイスフィルター</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Basic reset to ensure it looks okay before external CSS is loaded */
        body { font-family: sans-serif; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>アナログレコード風ボイスフィルター</h1>
        <p>あなたの声を、ノイズ混じりの夢のような音質に変換します。</p>

        <div class="visualizer-container">
            <div id="record-indicator" class="record-indicator"></div>
        </div>

        <div class="controls">
            <button id="start-btn">マイクをオンにする</button>
            <button id="stop-btn" disabled>停止</button>
        </div>

        <p id="status-message">ボタンを押して開始してください</p>

        <hr style="border: 0; border-top: 1px solid #d4c5a9; margin: 2rem 0;">

        <div class="file-section">
            <h2>または音声ファイルをアップロード</h2>
            <input type="file" id="file-upload" accept="audio/*">
            <br><br>
            <button id="process-btn" disabled>変換してダウンロード</button>
            <div id="download-area" style="margin-top: 1rem;"></div>
        </div>
    </div>

    <script src="js/wav-encoder.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
